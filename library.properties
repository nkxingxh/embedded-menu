sentence=A lightweight, object-oriented menu library for Arduino.
paragraph=This lightweight menu library provides a flexible way to create interactive menus on Arduino displays. Built on the U8g2 graphics library, it supports dynamic menu construction through callback functions, multi-level navigation, message boxes, and prompt dialogs. The library uses an object-oriented design with MenuItem and MenuNavigator classes, making it easy to build complex menu systems with minimal code.
